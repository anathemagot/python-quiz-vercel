<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Output Quiz</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --border: #2a2a35;
            --accent: #00e5a0;
            --accent2: #ff6b6b;
            --accent3: #ffd93d;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --code-bg: #0a0a0c;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            padding: 40px 20px 80px;
        }

        body.no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 229, 160, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeDown 0.6s ease both;
        }

        .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
            display: block;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 12px;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .progress-bar-wrap {
            background: var(--border);
            height: 3px;
            border-radius: 2px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.5s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 0 12px var(--accent);
        }

        .progress-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            text-align: right;
            margin-bottom: 32px;
        }

        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            animation: fadeUp 0.4s ease both;
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .q-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .q-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .q-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            flex: 1;
        }

        .difficulty {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid;
            white-space: nowrap;
        }

        .diff-easy {
            color: var(--accent);
            border-color: var(--accent);
        }

        .diff-medium {
            color: var(--accent3);
            border-color: var(--accent3);
        }

        .diff-hard {
            color: var(--accent2);
            border-color: var(--accent2);
        }

        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 18px 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.75;
            overflow-x: auto;
            margin-bottom: 24px;
            color: #c9d1d9;
        }

        .kw {
            color: #ff7b72;
        }

        .fn {
            color: #79c0ff;
        }

        .str {
            color: #a5d6ff;
        }

        .num {
            color: #f2cc60;
        }

        .cm {
            color: #6e7681;
            font-style: italic;
        }

        .var {
            color: #ffa657;
        }

        .cls {
            color: #f0883e;
        }

        .options-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .options {
            display: grid;
            gap: 9px;
        }

        .option {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.18s ease;
            text-align: left;
            width: 100%;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        .option:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateX(4px);
        }

        .option .opt-letter {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.18s;
        }

        .option .opt-text {
            white-space: pre;
            line-height: 1.5;
        }

        .option.correct {
            border-color: var(--accent);
            background: rgba(0, 229, 160, 0.08);
            color: var(--accent);
        }

        .option.correct .opt-letter {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .option.wrong {
            border-color: var(--accent2);
            background: rgba(255, 107, 107, 0.08);
            color: var(--accent2);
        }

        .option.wrong .opt-letter {
            background: var(--accent2);
            color: #fff;
            border-color: var(--accent2);
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.83rem;
            font-family: 'JetBrains Mono', monospace;
            display: none;
            animation: fadeUp 0.3s ease;
            line-height: 1.6;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(0, 229, 160, 0.1);
            border: 1px solid rgba(0, 229, 160, 0.3);
            color: var(--accent);
        }

        .feedback.wrong {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff9999;
        }

        .nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 11px 26px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.3);
        }

        .btn.show {
            display: block;
        }

        /* ── Name screen ── */
        #name-screen {
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        #name-screen.hide {
            display: none;
        }

        .name-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 32px;
            margin-top: 16px;
        }

        .input-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            text-align: left;
            max-width: 360px;
            margin: 0 auto 6px;
        }

        .name-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .name-card p {
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.83rem;
            margin-bottom: 28px;
        }

        .input-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            text-align: left;
            max-width: 360px;
            margin: 0 auto 6px;
        }

        .name-input {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text);
            width: 100%;
            max-width: 360px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.12);
        }

        .btn-start {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 13px 34px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.3);
        }

        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Score screen ── */
        #score-screen {
            display: none;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        #score-screen.show {
            display: block;
        }

        .score-ring {
            width: 160px;
            height: 160px;
            margin: 0 auto 32px;
            position: relative;
        }

        .score-ring svg {
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 8;
        }

        .ring-fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 408;
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 1.2s cubic-bezier(.4, 0, .2, 1) 0.3s;
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .score-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-num {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--accent);
        }

        .score-denom {
            font-size: 0.8rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .score-msg {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .score-sub {
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            margin-bottom: 40px;
        }

        /* Saving indicator */
        .save-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: inline-block;
        }

        .save-status.saving {
            color: var(--accent3);
            background: rgba(255, 217, 61, 0.1);
            border: 1px solid rgba(255, 217, 61, 0.3);
        }

        .save-status.saved {
            color: var(--accent);
            background: rgba(0, 229, 160, 0.1);
            border: 1px solid rgba(0, 229, 160, 0.3);
        }

        .save-status.error {
            color: var(--accent2);
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .review-section {
            margin-top: 48px;
            text-align: left;
        }

        .review-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .review-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        .review-icon {
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .review-q {
            color: var(--text);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .review-ans {
            color: var(--muted);
        }

        .review-ans span {
            font-weight: 700;
        }

        .review-ans .ok {
            color: var(--accent);
        }

        .review-ans .fail {
            color: var(--accent2);
        }

        .btn-restart {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 13px 34px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            background: var(--accent);
            color: #000;
        }


        /* ── Anti-cheat ── */
        .warn-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent3);
            background: rgba(255, 217, 61, 0.1);
            border: 1px solid rgba(255, 217, 61, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: none;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <span class="warn-badge" id="warn-badge">⚠ <span id="warn-count">0</span>/3 advertencias</span>
    <div class="container">
        <header>
            <span class="label">// Python Challenge</span>
            <h1>¿Qué imprime este código?</h1>
            <p class="subtitle">Lee → predice → responde</p>
        </header>

        <!-- Name screen -->
        <div id="name-screen">
            <div class="name-card">
                <h2>Ingresa tus datos</h2>
                <p>Se guardarán junto con tu puntaje al finalizar</p>

                <span class="input-label">// Nombre completo</span>
                <input class="name-input" type="text" id="player-name" placeholder="Tu nombre completo..."
                    maxlength="80" autocomplete="off" />

                <span class="input-label">// Número de control</span>
                <input class="name-input" type="text" id="player-control" placeholder="Ej. 21100001..." maxlength="20"
                    autocomplete="off" />

                <button class="btn-start" id="btn-start" onclick="startQuiz()" disabled>
                    Comenzar Quiz →
                </button>
            </div>
        </div>

        <!-- Quiz area -->
        <div id="quiz-wrapper" style="display:none;">
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="progress-label" id="progress-label">0 / 30</div>
            <div id="quiz-area"></div>
        </div>

        <!-- Score screen -->
        <div id="score-screen">
            <div class="score-ring">
                <svg viewBox="0 0 130 130" width="160" height="160">
                    <circle class="ring-bg" cx="65" cy="65" r="65" />
                    <circle class="ring-fill" id="ring" cx="65" cy="65" r="65" />
                </svg>
                <div class="score-center">
                    <span class="score-num" id="score-num">0</span>
                    <span class="score-denom" id="score-denom">/ 30</span>
                </div>
            </div>
            <p class="score-msg" id="score-msg"></p>
            <p class="score-sub" id="score-sub"></p>

            <div id="save-status-wrap"></div>

            <button class="btn-restart" onclick="restart()">↺ Reiniciar Quiz</button>

            <div class="review-section">
                <p class="review-title">// Resumen de respuestas</p>
                <div id="review-list"></div>
            </div>
        </div>

        <!-- Anti-cheat warning modal -->
        <div id="cheat-modal"
            style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center;">
            <div
                style="background:#16161a; border:1px solid #ff6b6b; border-radius:16px; padding:40px 36px; max-width:420px; width:90%; text-align:center; animation:fadeUp 0.3s ease;">
                <div style="font-size:2.5rem; margin-bottom:16px;">⚠️</div>
                <h2 style="font-size:1.3rem; font-weight:800; color:#ff6b6b; margin-bottom:10px;">Salida detectada</h2>
                <p id="cheat-msg"
                    style="font-family:'JetBrains Mono',monospace; font-size:0.83rem; color:#6b6b80; line-height:1.6; margin-bottom:24px;">
                </p>
                <div id="cheat-counter"
                    style="font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:#ffd93d; margin-bottom:20px;">
                </div>
                <button onclick="closeWarning()"
                    style="background:#00e5a0; color:#000; border:none; padding:11px 28px; border-radius:8px; font-family:'Syne',sans-serif; font-weight:700; font-size:0.88rem; cursor:pointer;">Entendido,
                    continuar</button>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  Las keys están en Vercel — no se exponen aquí
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        async function guardarResultado(nombre, numero_de_control, puntaje, total) {
            try {
                const res = await fetch('/api/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, numero_de_control, puntaje, total })
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        // ── Quiz data ────────────────────────────────────────────────
        const Q = [
            { title: "Aritmética básica", difficulty: "easy", highlight: `<span class="fn">print</span>(<span class="num">2</span> + <span class="num">3</span> * <span class="num">4</span>)`, options: ["20", "14", "24", "10"], correct: 1, explanation: "Multiplicación primero: 3×4=12, luego 2+12=14." },
            { title: "División entera y módulo", difficulty: "easy", highlight: `<span class="fn">print</span>(<span class="num">17</span> // <span class="num">5</span>, <span class="num">17</span> % <span class="num">5</span>)`, options: ["3 2", "3.4 2", "3 3", "4 2"], correct: 0, explanation: "// es división entera: 17//5=3. % es módulo (resto): 17%5=2." },
            { title: "String repetición", difficulty: "easy", highlight: `<span class="fn">print</span>(<span class="str">"ha"</span> * <span class="num">3</span>)`, options: ["ha ha ha", "hahaha", "ha*3", "3ha"], correct: 1, explanation: '"ha" * 3 repite el string 3 veces: "hahaha".' },
            { title: "Tipo de dato", difficulty: "easy", highlight: `<span class="fn">print</span>(<span class="fn">type</span>(<span class="num">3.14</span>))`, options: ["&lt;class 'int'&gt;", "&lt;class 'float'&gt;", "&lt;class 'double'&gt;", "&lt;class 'number'&gt;"], correct: 1, explanation: "3.14 es un número decimal, por lo tanto es de tipo float." },
            { title: "Booleano y comparación", difficulty: "easy", highlight: `<span class="fn">print</span>(<span class="num">5</span> == <span class="num">5.0</span>)`, options: ["False", "True", "Error", "None"], correct: 1, explanation: "Python compara valores, no tipos. 5 y 5.0 son iguales en valor → True." },
            { title: "len() en string", difficulty: "easy", highlight: `<span class="fn">print</span>(<span class="fn">len</span>(<span class="str">"Python"</span>))`, options: ["5", "6", "7", "8"], correct: 1, explanation: '"Python" tiene 6 caracteres: P-y-t-h-o-n.' },
            { title: "Concatenación de strings", difficulty: "easy", highlight: `a = <span class="str">"Hola"</span>\nb = <span class="str">" Mundo"</span>\n<span class="fn">print</span>(a + b)`, options: ["HolaMundo", "Hola Mundo", "Hola+Mundo", "Error"], correct: 1, explanation: 'Concatenar "Hola" + " Mundo" = "Hola Mundo".' },
            { title: "Variable reasignada", difficulty: "easy", highlight: `x = <span class="num">10</span>\nx = x + <span class="num">5</span>\nx = x * <span class="num">2</span>\n<span class="fn">print</span>(x)`, options: ["30", "25", "20", "15"], correct: 0, explanation: "x=10 → x=10+5=15 → x=15*2=30." },
            { title: "input() con int()", difficulty: "easy", highlight: `<span class="cm"># Asume que el usuario ingresa: 7</span>\nn = <span class="fn">int</span>(<span class="fn">input</span>())\n<span class="fn">print</span>(n * <span class="num">3</span>)`, options: ["777", "73", "21", "Error"], correct: 2, explanation: "int('7') convierte a entero. 7 * 3 = 21." },
            { title: "f-string básico", difficulty: "easy", highlight: `nombre = <span class="str">"Ana"</span>\nedad = <span class="num">25</span>\n<span class="fn">print</span>(<span class="str">f"</span>{nombre}<span class="str"> tiene </span>{edad}<span class="str"> años"</span>)`, options: ["nombre tiene edad años", "Ana tiene 25 años", "{nombre} tiene {edad} años", "Error"], correct: 1, explanation: "Las f-strings insertan el valor de las variables dentro de { }." },
            { title: "Índice negativo en lista", difficulty: "medium", highlight: `datos = [<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>]\n<span class="fn">print</span>(datos[-<span class="num">2</span>])`, options: ["30", "20", "40", "10"], correct: 0, explanation: "Índice -1 es el último (40), -2 es el penúltimo (30)." },
            { title: "While con break", difficulty: "medium", highlight: `i = <span class="num">0</span>\n<span class="kw">while</span> i < <span class="num">10</span>:\n    i += <span class="num">3</span>\n    <span class="kw">if</span> i == <span class="num">6</span>:\n        <span class="kw">break</span>\n<span class="fn">print</span>(i)`, options: ["9", "6", "3", "10"], correct: 1, explanation: "i: 0→3→6. Cuando i==6 se ejecuta break y sale. print(i) = 6." },
            { title: "Función con valor default", difficulty: "medium", highlight: `<span class="kw">def</span> <span class="fn">saludar</span>(nombre=<span class="str">"mundo"</span>):\n    <span class="fn">print</span>(<span class="str">f"Hola {nombre}"</span>)\n\n<span class="fn">saludar</span>()\n<span class="fn">saludar</span>(<span class="str">"Paco"</span>)`, options: ["Hola mundo\nHola Paco", "Hola\nHola Paco", "Error\nHola Paco", "Hola nombre\nHola Paco"], correct: 0, explanation: "Si no se pasa argumento, se usa el default 'mundo'. La segunda llamada usa 'Paco'." },
            // { title: "for con range: ¿cuántas veces?", difficulty: "easy", highlight: `cuenta = <span class="num">0</span>\n<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">5</span>):\n    cuenta += <span class="num">1</span>\n<span class="fn">print</span>(cuenta)`, options: ["4", "5", "6", "0"], correct: 1, explanation: "range(5) genera 0,1,2,3,4 → 5 iteraciones." },
            // { title: "if / elif / else: ¿cuál rama?", difficulty: "easy", highlight: `x = <span class="num">0</span>\n<span class="kw">if</span> x > <span class="num">0</span>:\n    <span class="fn">print</span>(<span class="str">"positivo"</span>)\n<span class="kw">elif</span> x < <span class="num">0</span>:\n    <span class="fn">print</span>(<span class="str">"negativo"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"cero"</span>)`, options: ["positivo", "negativo", "cero", "Error"], correct: 2, explanation: "x=0 no es >0 ni <0, así que cae en el else → 'cero'." },
            // { title: "while: valor final", difficulty: "easy", highlight: `n = <span class="num">1</span>\n<span class="kw">while</span> n < <span class="num">50</span>:\n    n = n * <span class="num">2</span>\n<span class="fn">print</span>(n)`, options: ["32", "48", "64", "50"], correct: 2, explanation: "n: 1→2→4→8→16→32→64. Cuando n=64 ya no cumple n<50 y sale." },
            // { title: "for con continue", difficulty: "medium", highlight: `<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">1</span>, <span class="num">6</span>):\n    <span class="kw">if</span> i % <span class="num">2</span> == <span class="num">0</span>:\n        <span class="kw">continue</span>\n    <span class="fn">print</span>(i, end=<span class="str">" "</span>)`, options: ["1 2 3 4 5", "2 4", "1 3 5", "1 2 3"], correct: 2, explanation: "continue salta la iteración cuando i es par. Solo se imprimen los impares: 1 3 5." },
            // { title: "if anidado", difficulty: "medium", highlight: `edad = <span class="num">20</span>\ntiene_id = <span class="kw">True</span>\n<span class="kw">if</span> edad >= <span class="num">18</span>:\n    <span class="kw">if</span> tiene_id:\n        <span class="fn">print</span>(<span class="str">"Puede entrar"</span>)\n    <span class="kw">else</span>:\n        <span class="fn">print</span>(<span class="str">"Sin ID"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"Menor de edad"</span>)`, options: ["Sin ID", "Menor de edad", "Puede entrar", "Error"], correct: 2, explanation: "edad=20 ≥ 18 → primer if True. tiene_id=True → segundo if True → 'Puede entrar'." },
            // { title: "for acumulando suma", difficulty: "easy", highlight: `suma = <span class="num">0</span>\n<span class="kw">for</span> n <span class="kw">in</span> [<span class="num">2</span>, <span class="num">4</span>, <span class="num">6</span>, <span class="num">8</span>]:\n    suma += n\n<span class="fn">print</span>(suma)`, options: ["24", "20", "10", "48"], correct: 1, explanation: "2+4+6+8 = 20." },
            // { title: "while con resta: ¿qué imprime?", difficulty: "medium", highlight: `i = <span class="num">10</span>\n<span class="kw">while</span> i > <span class="num">0</span>:\n    i -= <span class="num">3</span>\n<span class="fn">print</span>(i)`, options: ["1", "0", "-2", "-1"], correct: 2, explanation: "i: 10→7→4→1→-2. Cuando i=-2 ya no cumple i>0 y sale el bucle." },
            // { title: "for con break y else", difficulty: "medium", highlight: `<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">5</span>):\n    <span class="kw">if</span> i == <span class="num">3</span>:\n        <span class="kw">break</span>\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"termino"</span>)\n<span class="fn">print</span>(i)`, options: ["termino\n3", "3", "termino", "4"], correct: 1, explanation: "El else del for solo corre si NO hubo break. Como sí hay break en i==3, el else se omite. Solo se imprime i=3." },
            // { title: "if con operador or", difficulty: "medium", highlight: `dia = <span class="str">"sabado"</span>\n<span class="kw">if</span> dia == <span class="str">"sabado"</span> <span class="kw">or</span> dia == <span class="str">"domingo"</span>:\n    <span class="fn">print</span>(<span class="str">"fin de semana"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"dia laboral"</span>)`, options: ["dia laboral", "fin de semana", "sabado", "Error"], correct: 1, explanation: "dia=='sabado' es True. Con or basta una condición True → 'fin de semana'." },
            // { title: "for dentro de for", difficulty: "medium", highlight: `cuenta = <span class="num">0</span>\n<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">3</span>):\n    <span class="kw">for</span> j <span class="kw">in</span> <span class="fn">range</span>(<span class="num">2</span>):\n        cuenta += <span class="num">1</span>\n<span class="fn">print</span>(cuenta)`, options: ["5", "6", "9", "3"], correct: 1, explanation: "El bucle exterior corre 3 veces, el interior 2 veces cada vez. Total: 3×2 = 6." },
            // { title: "while: nunca entra", difficulty: "easy", highlight: `x = <span class="num">5</span>\n<span class="kw">while</span> x > <span class="num">10</span>:\n    x += <span class="num">1</span>\n<span class="fn">print</span>(x)`, options: ["5", "10", "11", "Error"], correct: 0, explanation: "x=5 no cumple x>10 desde el inicio. El bucle nunca se ejecuta. print(x) = 5." },
            // { title: "if con not", difficulty: "medium", highlight: `llueve = <span class="kw">False</span>\n<span class="kw">if</span> <span class="kw">not</span> llueve:\n    <span class="fn">print</span>(<span class="str">"sin paraguas"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"lleva paraguas"</span>)`, options: ["lleva paraguas", "sin paraguas", "False", "Error"], correct: 1, explanation: "llueve=False. not False = True → entra al if → 'sin paraguas'." },
            // { title: "range con paso negativo", difficulty: "medium", highlight: `<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">5</span>, <span class="num">0</span>, -<span class="num">1</span>):\n    <span class="fn">print</span>(i, end=<span class="str">" "</span>)`, options: ["5 4 3 2 1 0", "5 4 3 2 1", "4 3 2 1 0", "0 1 2 3 4 5"], correct: 1, explanation: "range(5, 0, -1) genera 5,4,3,2,1. El 0 no se incluye (es el stop exclusivo)." },
            // { title: "break al encontrar valor", difficulty: "medium", highlight: `intentos = <span class="num">0</span>\nclave = <span class="str">"python"</span>\nrespuestas = [<span class="str">"java"</span>, <span class="str">"python"</span>, <span class="str">"c++"</span>]\n<span class="kw">for</span> r <span class="kw">in</span> respuestas:\n    intentos += <span class="num">1</span>\n    <span class="kw">if</span> r == clave:\n        <span class="kw">break</span>\n<span class="fn">print</span>(intentos)`, options: ["1", "2", "3", "0"], correct: 1, explanation: "1er intento: 'java' ≠ clave. 2do: 'python' == clave → break. intentos = 2." },
            // { title: "if con and: ambas condiciones", difficulty: "medium", highlight: `temp = <span class="num">22</span>\nhumedad = <span class="num">80</span>\n<span class="kw">if</span> temp > <span class="num">20</span> <span class="kw">and</span> humedad > <span class="num">70</span>:\n    <span class="fn">print</span>(<span class="str">"bochornoso"</span>)\n<span class="kw">elif</span> temp > <span class="num">20</span>:\n    <span class="fn">print</span>(<span class="str">"caliente"</span>)\n<span class="kw">else</span>:\n    <span class="fn">print</span>(<span class="str">"fresco"</span>)`, options: ["caliente", "fresco", "bochornoso", "Error"], correct: 2, explanation: "temp=22>20 (True) AND humedad=80>70 (True). Ambas True → 'bochornoso'." }
        ];

        let current = 0, score = 0, answered = false, results = [];
        let playerName = '', playerControl = '';

        // ── Name screen logic ────────────────────────────────────────
        const nameInput = document.getElementById('player-name');
        const controlInput = document.getElementById('player-control');
        const btnStart = document.getElementById('btn-start');

        function checkInputs() {
            btnStart.disabled = nameInput.value.trim().length === 0 || controlInput.value.trim().length === 0;
        }

        nameInput.addEventListener('input', checkInputs);
        controlInput.addEventListener('input', checkInputs);

        controlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startQuiz();
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') controlInput.focus();
        });

        function startQuiz() {
            playerName = nameInput.value.trim();
            playerControl = controlInput.value.trim();
            if (!playerName || !playerControl) return;
            document.getElementById('name-screen').classList.add('hide');
            document.getElementById('quiz-wrapper').style.display = 'block';
            quizActive = true;
            warnings = 0;
            document.body.classList.add('no-select');
            document.getElementById('warn-badge').style.display = 'none';
            render();
        }

        // ── Quiz logic ───────────────────────────────────────────────
        function render() {
            const q = Q[current];
            const area = document.getElementById('quiz-area');
            const diffMap = { easy: 'diff-easy', medium: 'diff-medium', hard: 'diff-hard' };
            const diffLabel = { easy: 'Fácil', medium: 'Medio', hard: 'Difícil' };
            const letters = ['A', 'B', 'C', 'D'];

            area.innerHTML = `
            <div class="question-card active">
              <div class="q-header">
                <span class="q-num">// ${current + 1} de ${Q.length}</span>
                <span class="q-title">${q.title}</span>
                <span class="difficulty ${diffMap[q.difficulty]}">${diffLabel[q.difficulty]}</span>
              </div>
              <pre>${q.highlight}</pre>
              <p class="options-label">¿Cuál es el output?</p>
              <div class="options">
                ${q.options.map((opt, i) => `
                  <button class="option" onclick="selectAnswer(${i})" id="opt-${i}">
                    <span class="opt-letter">${letters[i]}</span>
                    <span class="opt-text">${opt}</span>
                  </button>
                `).join('')}
              </div>
              <div class="feedback" id="feedback"></div>
              <div class="nav">
                <button class="btn" id="next-btn" onclick="nextQ()">
                  ${current < Q.length - 1 ? 'Siguiente →' : 'Ver resultados'}
                </button>
              </div>
            </div>`;

            updateProgress();
            answered = false;
        }

        function selectAnswer(idx) {
            if (answered) return;
            answered = true;

            const q = Q[current];
            const fb = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');
            const isCorrect = idx === q.correct;

            if (isCorrect) score++;
            results.push({ title: q.title, correct: isCorrect, chosen: q.options[idx], answer: q.options[q.correct] });

            for (let i = 0; i < q.options.length; i++) {
                document.getElementById(`opt-${i}`).disabled = true;
            }

            if (isCorrect) {
                document.getElementById(`opt-${idx}`).classList.add('correct');
                fb.className = 'feedback correct show';
                fb.innerHTML = `✓ ¡Correcto! — ${q.explanation}`;
            } else {
                document.getElementById(`opt-${idx}`).classList.add('wrong');
                document.getElementById(`opt-${q.correct}`).classList.add('correct');
                fb.className = 'feedback wrong show';
                fb.innerHTML = `✗ Incorrecto — ${q.explanation}`;
            }

            nextBtn.classList.add('show');
        }

        function nextQ() {
            current++;
            if (current >= Q.length) showScore();
            else render();
        }

        function updateProgress() {
            const pct = (current / Q.length) * 100;
            document.getElementById('progress').style.width = pct + '%';
            document.getElementById('progress-label').textContent = `${current} / ${Q.length}`;
        }

        async function showScore() {
            document.getElementById('quiz-wrapper').style.display = 'none';

            quizActive = false;
            document.body.classList.remove('no-select');
            const screen = document.getElementById('score-screen');
            screen.classList.add('show');

            const pct = score / Q.length;
            const circumference = 2 * Math.PI * 65;
            const offset = circumference - pct * circumference;

            document.getElementById('score-num').textContent = score;
            document.getElementById('score-denom').textContent = `/ ${Q.length}`;

            setTimeout(() => {
                document.getElementById('ring').style.strokeDashoffset = offset;
            }, 100);

            let msg, sub;
            if (pct === 1) { msg = '🏆 ¡Perfecto!'; sub = 'Dominas Python completamente'; }
            else if (pct >= 0.8) { msg = '🔥 ¡Excelente!'; sub = 'Conoces muy bien Python'; }
            else if (pct >= 0.6) { msg = '💪 ¡Bien hecho!'; sub = 'Sólidas bases en Python'; }
            else if (pct >= 0.4) { msg = '📚 Sigue practicando'; sub = 'Vas por buen camino'; }
            else { msg = '💡 A repasar conceptos'; sub = 'Vuelve a intentarlo, puedes mejorar'; }

            document.getElementById('score-msg').textContent = msg;
            document.getElementById('score-sub').textContent = sub;

            // ── Save to Supabase ─────────────────────────────────────
            const wrap = document.getElementById('save-status-wrap');
            wrap.innerHTML = `<span class="save-status saving">⏳ Guardando resultado...</span>`;

            const ok = await guardarResultado(playerName, playerControl, score, Q.length);

            wrap.innerHTML = ok
                ? `<span class="save-status saved">✓ Resultado guardado para <strong>${playerName}</strong></span>`
                : `<span class="save-status error">⚠ No se pudo guardar (revisa la configuración de Supabase)</span>`;

            // ── Review list ──────────────────────────────────────────
            const list = document.getElementById('review-list');
            list.innerHTML = results.map((r, i) => `
            <div class="review-item">
              <span class="review-icon">${r.correct ? '✅' : '❌'}</span>
              <div>
                <div class="review-q">${i + 1}. ${r.title}</div>
                <div class="review-ans">
                  ${r.correct
                    ? `Tu respuesta: <span class="ok">${r.answer}</span>`
                    : `Tu respuesta: <span class="fail">${r.chosen}</span> · Correcta: <span class="ok">${r.answer}</span>`}
                </div>
              </div>
            </div>`).join('');
        }


        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ANTI-TRAMPA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let warnings = 0;
        const MAX_WARNINGS = 3;
        let quizActive = false; // solo activo durante el quiz

        // ── Bloquear clic derecho ────────────────────────────────
        document.addEventListener('contextmenu', e => {
            if (quizActive) e.preventDefault();
        });

        // ── Bloquear copy / paste / cut ──────────────────────────
        ['copy', 'paste', 'cut'].forEach(evt => {
            document.addEventListener(evt, e => {
                if (quizActive) e.preventDefault();
            });
        });

        // ── Bloquear F12, Ctrl+Shift+I/J/C/U y Ctrl+C/X/V/A ───
        document.addEventListener('keydown', e => {
            if (!quizActive) return;
            const blocked =
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && ['U', 'C', 'X', 'V', 'A', 'S'].includes(e.key.toUpperCase()));
            if (blocked) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        // ── Bloquear selección de texto con mouse ────────────────
        document.addEventListener('selectstart', e => {
            if (quizActive) e.preventDefault();
        });

        // ── Bloquear drag de texto ───────────────────────────────
        document.addEventListener('dragstart', e => {
            if (quizActive) e.preventDefault();
        });

        // ── Detectar cambio de tab / minimizar ventana ───────────
        document.addEventListener('visibilitychange', () => {
            if (!quizActive || document.visibilityState !== 'hidden') return;
            warnings++;
            updateWarnBadge();
            if (warnings >= MAX_WARNINGS) {
                terminateExam();
            } else {
                showWarning(
                    `Saliste de la ventana del examen. Esto quedará registrado.`,
                    `Advertencia ${warnings} de ${MAX_WARNINGS}. Al llegar a 3 el examen terminará automáticamente.`
                );
            }
        });

        function updateWarnBadge() {
            const badge = document.getElementById('warn-badge');
            const count = document.getElementById('warn-count');
            badge.style.display = 'inline-flex';
            count.textContent = warnings;
        }

        function showWarning(msg, counter) {
            document.getElementById('cheat-msg').textContent = msg;
            document.getElementById('cheat-counter').textContent = counter;
            const modal = document.getElementById('cheat-modal');
            modal.style.display = 'flex';
        }

        function closeWarning() {
            document.getElementById('cheat-modal').style.display = 'none';
        }

        function terminateExam() {
            quizActive = false;
            document.getElementById('cheat-modal').style.display = 'none';
            document.getElementById('quiz-wrapper').style.display = 'none';
            // Force show score with penalty note
            score = 0;
            showScore();
            setTimeout(() => {
                document.getElementById('score-msg').textContent = '🚫 Examen cancelado';
                document.getElementById('score-sub').textContent = 'Se detectaron demasiadas salidas de ventana';
            }, 200);
        }

        function restart() {
            current = 0; score = 0; results = []; playerName = ''; playerControl = ''; quizActive = false; warnings = 0; document.getElementById('warn-badge').style.display = 'none'; document.body.classList.remove('no-select');
            document.getElementById('score-screen').classList.remove('show');
            document.getElementById('name-screen').classList.remove('hide');
            nameInput.value = '';
            btnStart.disabled = true;
        }
    </script>
</body>

</html>
