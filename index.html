<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Output Quiz</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --border: #2a2a35;
            --accent: #00e5a0;
            --accent2: #ff6b6b;
            --accent3: #ffd93d;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --code-bg: #0a0a0c;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            padding: 40px 20px 80px;
        }

        body.no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 229, 160, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeDown 0.6s ease both;
        }

        .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
            display: block;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 12px;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .progress-bar-wrap {
            background: var(--border);
            height: 3px;
            border-radius: 2px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.5s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 0 12px var(--accent);
        }

        .progress-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            text-align: right;
            margin-bottom: 32px;
        }

        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            animation: fadeUp 0.4s ease both;
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .q-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .q-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .q-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            flex: 1;
        }

        .difficulty {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid;
            white-space: nowrap;
        }

        .diff-easy {
            color: var(--accent);
            border-color: var(--accent);
        }

        .diff-medium {
            color: var(--accent3);
            border-color: var(--accent3);
        }

        .diff-hard {
            color: var(--accent2);
            border-color: var(--accent2);
        }

        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 18px 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.75;
            overflow-x: auto;
            margin-bottom: 24px;
            color: #c9d1d9;
        }

        .kw {
            color: #ff7b72;
        }

        .fn {
            color: #79c0ff;
        }

        .str {
            color: #a5d6ff;
        }

        .num {
            color: #f2cc60;
        }

        .cm {
            color: #6e7681;
            font-style: italic;
        }

        .var {
            color: #ffa657;
        }

        .cls {
            color: #f0883e;
        }

        .options-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .options {
            display: grid;
            gap: 9px;
        }

        .option {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.18s ease;
            text-align: left;
            width: 100%;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        .option:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateX(4px);
        }

        .option .opt-letter {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.18s;
        }

        .option .opt-text {
            white-space: pre;
            line-height: 1.5;
        }

        .option.correct {
            border-color: var(--accent);
            background: rgba(0, 229, 160, 0.08);
            color: var(--accent);
        }

        .option.correct .opt-letter {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .option.wrong {
            border-color: var(--accent2);
            background: rgba(255, 107, 107, 0.08);
            color: var(--accent2);
        }

        .option.wrong .opt-letter {
            background: var(--accent2);
            color: #fff;
            border-color: var(--accent2);
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.83rem;
            font-family: 'JetBrains Mono', monospace;
            display: none;
            animation: fadeUp 0.3s ease;
            line-height: 1.6;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(0, 229, 160, 0.1);
            border: 1px solid rgba(0, 229, 160, 0.3);
            color: var(--accent);
        }

        .feedback.wrong {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff9999;
        }

        .nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 11px 26px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.3);
        }

        .btn.show {
            display: block;
        }

        /* ── Name screen ── */
        #name-screen {
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        #name-screen.hide {
            display: none;
        }

        .name-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 32px;
            margin-top: 16px;
        }

        .name-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .name-card p {
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.83rem;
            margin-bottom: 28px;
        }

        .input-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            text-align: left;
            max-width: 360px;
            margin: 0 auto 6px;
        }

        .name-input {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text);
            width: 100%;
            max-width: 360px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.12);
        }

        .btn-start {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 13px 34px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 229, 160, 0.3);
        }

        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Score screen ── */
        #score-screen {
            display: none;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        #score-screen.show {
            display: block;
        }

        .score-ring {
            width: 160px;
            height: 160px;
            margin: 0 auto 32px;
            position: relative;
        }

        .score-ring svg {
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 8;
        }

        .ring-fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 408;
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 1.2s cubic-bezier(.4, 0, .2, 1) 0.3s;
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .score-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-num {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--accent);
        }

        .score-denom {
            font-size: 0.8rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .score-msg {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .score-sub {
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            margin-bottom: 40px;
        }

        .save-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: inline-block;
        }

        .save-status.saving {
            color: var(--accent3);
            background: rgba(255, 217, 61, 0.1);
            border: 1px solid rgba(255, 217, 61, 0.3);
        }

        .save-status.saved {
            color: var(--accent);
            background: rgba(0, 229, 160, 0.1);
            border: 1px solid rgba(0, 229, 160, 0.3);
        }

        .save-status.error {
            color: var(--accent2);
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .review-section {
            margin-top: 48px;
            text-align: left;
        }

        .review-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .review-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        .review-icon {
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .review-q {
            color: var(--text);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .review-ans {
            color: var(--muted);
        }

        .review-ans span {
            font-weight: 700;
        }

        .review-ans .ok {
            color: var(--accent);
        }

        .review-ans .fail {
            color: var(--accent2);
        }

        .btn-restart {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 13px 34px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            background: var(--accent);
            color: #000;
        }

        /* ── Anti-cheat ── */
        .warn-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent3);
            background: rgba(255, 217, 61, 0.1);
            border: 1px solid rgba(255, 217, 61, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: none;
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <span class="warn-badge" id="warn-badge">⚠ <span id="warn-count">0</span>/3 advertencias</span>
    <div class="container">
        <header>
            <span class="label">// Python Challenge</span>
            <h1>¿Qué imprime este código?</h1>
            <p class="subtitle">Lee → predice → responde</p>
        </header>

        <!-- Name screen -->
        <div id="name-screen">
            <div class="name-card">
                <h2>Ingresa tus datos</h2>
                <p>Se guardarán junto con tu puntaje al finalizar</p>

                <span class="input-label">// Nombre completo</span>
                <input class="name-input" type="text" id="player-name" placeholder="Tu nombre completo..."
                    maxlength="80" autocomplete="off" />

                <span class="input-label">// Número de control</span>
                <input class="name-input" type="text" id="player-control" placeholder="Ej. 21100001..." maxlength="20"
                    autocomplete="off" />

                <button class="btn-start" id="btn-start" onclick="startQuiz()" disabled>
                    Comenzar Quiz →
                </button>
            </div>
        </div>

        <!-- Quiz area -->
        <div id="quiz-wrapper" style="display:none;">
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="progress-label" id="progress-label">0 / 30</div>
            <div id="quiz-area"></div>
        </div>

        <!-- Score screen -->
        <div id="score-screen">
            <div class="score-ring">
                <svg viewBox="0 0 130 130" width="160" height="160">
                    <circle class="ring-bg" cx="65" cy="65" r="65" />
                    <circle class="ring-fill" id="ring" cx="65" cy="65" r="65" />
                </svg>
                <div class="score-center">
                    <span class="score-num" id="score-num">0</span>
                    <span class="score-denom" id="score-denom">/ 30</span>
                </div>
            </div>
            <p class="score-msg" id="score-msg"></p>
            <p class="score-sub" id="score-sub"></p>

            <div id="save-status-wrap"></div>

            <button class="btn-restart" onclick="restart()">↺ Reiniciar Quiz</button>

            <div class="review-section">
                <p class="review-title">// Resumen de respuestas</p>
                <div id="review-list"></div>
            </div>
        </div>

        <!-- Anti-cheat warning modal -->
        <div id="cheat-modal"
            style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center;">
            <div
                style="background:#16161a; border:1px solid #ff6b6b; border-radius:16px; padding:40px 36px; max-width:420px; width:90%; text-align:center; animation:fadeUp 0.3s ease;">
                <div style="font-size:2.5rem; margin-bottom:16px;">⚠️</div>
                <h2 style="font-size:1.3rem; font-weight:800; color:#ff6b6b; margin-bottom:10px;">Salida detectada</h2>
                <p id="cheat-msg"
                    style="font-family:'JetBrains Mono',monospace; font-size:0.83rem; color:#6b6b80; line-height:1.6; margin-bottom:24px;">
                </p>
                <div id="cheat-counter"
                    style="font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:#ffd93d; margin-bottom:20px;">
                </div>
                <button onclick="closeWarning()"
                    style="background:#00e5a0; color:#000; border:none; padding:11px 28px; border-radius:8px; font-family:'Syne',sans-serif; font-weight:700; font-size:0.88rem; cursor:pointer;">Entendido,
                    continuar</button>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  Las keys están en Vercel — no se exponen aquí
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        /**
         * Guarda el resultado completo en el backend.
         *
         * El payload enviado al endpoint /api/guardar tiene la forma:
         * {
         *   nombre:            string,
         *   numero_de_control: string,
         *   puntaje:           number,
         *   total:             number,
         *   respuestas: [
         *     {
         *       pregunta:        number,   // 1-based
         *       titulo:          string,
         *       correcta:        boolean,
         *       respuesta_dada:  string,   // texto de la opción elegida
         *       respuesta_correcta: string // texto de la opción correcta
         *     },
         *     ...
         *   ]
         * }
         */
        async function guardarResultado(nombre, numero_de_control, puntaje, total, respuestas) {
            try {
                const res = await fetch('/api/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, numero_de_control, puntaje, total, respuestas })
                });
                return res.ok;
            } catch (e) {
                return false;

        controlInput.addEventListener('input', checkInputs);

            document.getElementById('quiz-wrapper').style.display = 'block';

            document.getElementById('progress').style.width = pct + '%';
            document.getElementById('progress-label').textContent = `${current} / ${Q.length}`;
        }

        async function showScore() {
            document.getElementById('quiz-wrapper').style.display = 'none';

            quizActive = false;
            document.body.classList.remove('no-select');
            const screen = document.getElementById('score-screen');
            screen.classList.add('show');

            const pct = score / Q.length;
            const circumference = 2 * Math.PI * 65;
            const offset = circumference - pct * circumference;

            document.getElementById('score-num').textContent = score;
            document.getElementById('score-denom').textContent = `/ ${Q.length}`;

            setTimeout(() => {
                document.getElementById('ring').style.strokeDashoffset = offset;
            }, 100);

            let msg, sub;
            if (pct === 1) { msg = '🏆 ¡Perfecto!'; sub = 'Dominas Python completamente'; }
            else if (pct >= 0.8) { msg = '🔥 ¡Excelente!'; sub = 'Conoces muy bien Python'; }
            else if (pct >= 0.6) { msg = '💪 ¡Bien hecho!'; sub = 'Sólidas bases en Python'; }
            else if (pct >= 0.4) { msg = '📚 Sigue practicando'; sub = 'Vas por buen camino'; }
            else { msg = '💡 A repasar conceptos'; sub = 'Vuelve a intentarlo, puedes mejorar'; }

            document.getElementById('score-msg').textContent = msg;
            document.getElementById('score-sub').textContent = sub;

            // ── Save to backend (puntaje + respuestas completas) ─────
            const wrap = document.getElementById('save-status-wrap');
            wrap.innerHTML = `<span class="save-status saving">⏳ Guardando resultado...</span>`;

            const ok = await guardarResultado(playerName, playerControl, score, Q.length, results);

            wrap.innerHTML = ok
                ? `<span class="save-status saved">✓ Resultado guardado para <strong>${playerName}</strong></span>`
                : `<span class="save-status error">⚠ No se pudo guardar (revisa la configuración del backend)</span>`;

            // ── Review list ──────────────────────────────────────────
            const list = document.getElementById('review-list');
            list.innerHTML = results.map((r, i) => `
            <div class="review-item">
              <span class="review-icon">${r.correcta ? '✅' : '❌'}</span>
              <div>
                <div class="review-q">${i + 1}. ${r.titulo}</div>
                <div class="review-ans">
                  ${r.correcta
                    ? `Tu respuesta: <span class="ok">${r.respuesta_correcta}</span>`
                    : `Tu respuesta: <span class="fail">${r.respuesta_dada}</span> · Correcta: <span class="ok">${r.respuesta_correcta}</span>`}
                </div>
              </div>
            </div>`).join('');
        }


        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ANTI-TRAMPA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let warnings = 0;
        const MAX_WARNINGS = 3;
        let quizActive = false;

        document.addEventListener('contextmenu', e => {
            if (quizActive) e.preventDefault();
        });

        ['copy', 'paste', 'cut'].forEach(evt => {
            document.addEventListener(evt, e => {
                if (quizActive) e.preventDefault();
            });
        });

        document.addEventListener('keydown', e => {
            if (!quizActive) return;
            const blocked =
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && ['U', 'C', 'X', 'V', 'A', 'S'].includes(e.key.toUpperCase()));
            if (blocked) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        document.addEventListener('selectstart', e => {
            if (quizActive) e.preventDefault();
        });

        document.addEventListener('dragstart', e => {
            if (quizActive) e.preventDefault();
        });

        document.addEventListener('visibilitychange', () => {
            if (!quizActive || document.visibilityState !== 'hidden') return;
            warnings++;
            updateWarnBadge();
            if (warnings >= MAX_WARNINGS) {
                terminateExam();
            } else {
                showWarning(
                    `Saliste de la ventana del examen. Esto quedará registrado.`,
                    `Advertencia ${warnings} de ${MAX_WARNINGS}. Al llegar a 3 el examen terminará automáticamente.`
                );
            }
        });

        function updateWarnBadge() {
            const badge = document.getElementById('warn-badge');
            const count = document.getElementById('warn-count');
            badge.style.display = 'inline-flex';
            count.textContent = warnings;
        }

        function showWarning(msg, counter) {
            document.getElementById('cheat-msg').textContent = msg;
            document.getElementById('cheat-counter').textContent = counter;
            const modal = document.getElementById('cheat-modal');
            modal.style.display = 'flex';
        }

        function closeWarning() {
            document.getElementById('cheat-modal').style.display = 'none';
        }

        function terminateExam() {
            quizActive = false;
            document.getElementById('cheat-modal').style.display = 'none';
            document.getElementById('quiz-wrapper').style.display = 'none';
            score = 0;
            showScore();
            setTimeout(() => {
                document.getElementById('score-msg').textContent = '🚫 Examen cancelado';
                document.getElementById('score-sub').textContent = 'Se detectaron demasiadas salidas de ventana';
            }, 200);
        }

        function restart() {
            current = 0; score = 0; results = []; playerName = ''; playerControl = '';
            quizActive = false; warnings = 0;
            document.getElementById('warn-badge').style.display = 'none';
            document.body.classList.remove('no-select');
            document.getElementById('score-screen').classList.remove('show');
            document.getElementById('name-screen').classList.remove('hide');
            nameInput.value = '';
            controlInput.value = '';
            btnStart.disabled = true;
        }
    </script>
</body>

</html>
